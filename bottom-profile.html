<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المركز الشخصي - ACCE</title><link rel="stylesheet" href="styles.css"><style>
/* محتوى المركز الشخصي الجديد — شريط التنقل السفلي لم يتم تغييره */
.app{max-width:520px;margin:auto;padding-bottom:105px;min-height:100vh}
.profile-new{background:#fff;min-height:100vh}
.hero-img{display:block;width:100%;height:auto;max-height:430px;object-fit:cover}
.quick{display:grid;grid-template-columns:repeat(3,1fr);background:#3476df;color:#fff;padding:10px 4px 12px;border-radius:0 0 12px 12px}
.quick a{color:#fff;text-decoration:none;text-align:center;font-weight:800;font-size:15px}
.quick .qi{height:43px;display:flex;align-items:center;justify-content:center;font-size:30px}
.video-area{padding:14px 10px 10px;background:#fff}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#111;border-radius:3px;overflow:hidden}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.video .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:58px;background:rgba(0,0,0,.16);pointer-events:none}
.emp-title{margin:0 10px;background:#3476df;color:#fff;text-align:center;font-size:23px;font-weight:800;padding:7px;border-radius:9px 9px 0 0}
.emp-area{background:#fff;padding:8px 0 14px}
.emp-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 8px 7px;direction:ltr;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.emp-scroll::-webkit-scrollbar{display:none}
.emp{direction:rtl;flex:0 0 142px;min-height:78px;background:#fff;border:1px solid #e7ebf1;border-radius:10px;box-shadow:0 2px 7px rgba(0,0,0,.10);display:flex;align-items:center;justify-content:center;padding:6px}
.emp .face{width:45px;height:45px;border-radius:50%;object-fit:cover;background:#fff;margin-left:6px;flex:none;display:block}
.emp .id{font-size:15px;font-weight:800;color:#222;text-align:center;line-height:1.35}
.emp .money{font-size:16px;font-weight:900;color:#1458ae;text-align:center;line-height:1.35}
</style></head><body><div class="app"><div class="profile-new">
<img class="hero-img" src="profile-top.jpg" alt="الصورة العلوية">
<div class="quick"><a href="#"><div class="qi">◉</div>مركز المساعدة</a><a href="#"><div class="qi">▤</div>منع الاحتيال</a><a href="#"><div class="qi">▣</div>فيديو تعليمي</a></div>
<div class="video-area"><div class="video"><video controls playsinline preload="metadata"><source src="profile-video.mp4" type="video/mp4"></video><div class="play">▶</div></div></div>
<div class="emp-title">موظف</div><div class="emp-area"><div class="emp-scroll" id="empScroll">
<div class="emp"><img class="face" src="user-avatar-1.jpg" alt="مستخدم"><div><div class="id">••••4075</div><div class="money">$ 220</div></div></div>
<div class="emp"><img class="face" src="user-avatar-2.jpg" alt="مستخدم"><div><div class="id">••••8007</div><div class="money">$ 953</div></div></div>
<div class="emp"><img class="face" src="user-avatar-1.jpg" alt="مستخدم"><div><div class="id">••••7672</div><div class="money">$ 354</div></div></div>
<div class="emp"><img class="face" src="user-avatar-2.jpg" alt="مستخدم"><div><div class="id">••••1268</div><div class="money">$ 481</div></div></div>
<div class="emp"><img class="face" src="user-avatar-1.jpg" alt="مستخدم"><div><div class="id">••••6391</div><div class="money">$ 720</div></div></div>
</div></div></div></div>

  </a>
</nav><script>
const e=document.getElementById('empScroll');let stop=false,d=1;
e.addEventListener('touchstart',()=>stop=true,{passive:true});e.addEventListener('touchend',()=>setTimeout(()=>stop=false,1200),{passive:true});
setInterval(()=>{if(stop||e.scrollWidth<=e.clientWidth)return;e.scrollLeft+=d*.45;const m=e.scrollWidth-e.clientWidth;if(e.scrollLeft>=m-1)d=-1;if(e.scrollLeft<=1)d=1},35);
</script></body></html>
