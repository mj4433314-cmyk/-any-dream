<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ملفي - ACCE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:#f7fbff;color:#1768b5}
.app-container{min-height:100vh;padding-bottom:86px}
.top-image{width:100%;display:block;max-height:430px;object-fit:cover}
.quick-menu{display:grid;grid-template-columns:repeat(3,1fr);background:#3476df;color:#fff;padding:9px 4px 12px}
.quick-menu a{color:#fff;text-decoration:none;text-align:center;font-size:15px;font-weight:700}
.q-icon{height:42px;display:flex;align-items:center;justify-content:center;font-size:29px}
.video-area{padding:13px 10px 10px;background:#fff}
.video-box{width:100%;aspect-ratio:16/9;background:#111;border-radius:5px;overflow:hidden;position:relative}
.video-box video{width:100%;height:100%;object-fit:cover;display:block}
.play-cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:58px;background:rgba(0,0,0,.18);pointer-events:none}
.section-title{margin:0 10px;background:#3476df;color:#fff;text-align:center;font-size:23px;font-weight:800;padding:8px;border-radius:9px 9px 0 0}
.employee-area{background:#fff;padding:8px 0 12px}
.employee-list{display:flex;gap:8px;overflow-x:auto;padding:0 9px 8px;direction:ltr;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.employee-list::-webkit-scrollbar{display:none}
.employee{direction:rtl;flex:0 0 145px;min-height:76px;background:#fff;border:1px solid #eee;border-radius:10px;box-shadow:0 2px 7px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;padding:6px}
.employee-id{font-size:15px;font-weight:700;color:#222;text-align:center}.employee-money{font-size:16px;font-weight:800;color:#175bb2;text-align:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:82px;background:#fff;border-top:1px solid #e4e4e4;display:flex;align-items:stretch;justify-content:space-around;z-index:1000}
.nav-item{flex:1;min-width:0;text-decoration:none;color:#aaa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700}
.nav-item.active{color:#3476df}.nav-icon{font-size:30px;line-height:1}.nav-label{white-space:nowrap}
.center-btn{justify-content:flex-end;padding-bottom:4px}.center-btn .nav-icon{width:62px;height:62px;margin-top:-25px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#bcbcbc;color:#fff;box-shadow:0 2px 7px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="app-container">
<img class="top-image" src="profile-top.jpg" alt="الصورة العلوية">
<div class="quick-menu">
<a href="#"><div class="q-icon">◉</div>مركز المساعدة</a>
<a href="#"><div class="q-icon">▤</div>منع الاحتيال</a>
<a href="#"><div class="q-icon">▣</div>فيديو تعليمي</a>
</div>
<div class="video-area"><div class="video-box">
<video controls playsinline preload="metadata"><source src="profile-video.mp4" type="video/mp4"></video>
<div class="play-cover">▶</div>
</div></div>
<div class="section-title">موظف</div>
<div class="employee-area"><div class="employee-list" id="employeeList">
<div class="employee"><div><div class="employee-id">••••7672</div><div class="employee-money">$354</div></div></div>
<div class="employee"><div><div class="employee-id">••••4075</div><div class="employee-money">$220</div></div></div>
<div class="employee"><div><div class="employee-id">••••8007</div><div class="employee-money">$953</div></div></div>
<div class="employee"><div><div class="employee-id">••••1268</div><div class="employee-money">$481</div></div></div>
<div class="employee"><div><div class="employee-id">••••6391</div><div class="employee-money">$720</div></div></div>
</div></div>

<!-- شريط التنقل السفلي محفوظ كما في الملف الأصلي -->
<nav class="bottom-nav">
<a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span><span class="nav-label">المركز الشخصي</span></a>
<a href="videos.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">السجل</span></a>
<a href="shorts.html" class="nav-item"><span class="nav-icon">⚡</span><span class="nav-label">المنصب</span></a>
<a href="#" class="nav-item center-btn"><span class="nav-icon">➕</span></a>
<a href="employment.html" class="nav-item"><span class="nav-icon">💌</span><span class="nav-label">التوظيف</span></a>
<a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">الصفحة الرئيسية</span></a>
</nav>
</div>
<script>
const list=document.getElementById('employeeList');let paused=false,dir=1;
list.addEventListener('touchstart',()=>paused=true,{passive:true});
list.addEventListener('touchend',()=>setTimeout(()=>paused=false,1200),{passive:true});
setInterval(()=>{if(paused||list.scrollWidth<=list.clientWidth)return;list.scrollLeft+=dir*.45;const m=list.scrollWidth-list.clientWidth;if(list.scrollLeft>=m-1)dir=-1;if(list.scrollLeft<=1)dir=1},35);
</script>
</body></html>
