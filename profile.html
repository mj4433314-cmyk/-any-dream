<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المركز الشخصي - ACCE</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Tahoma,Arial,sans-serif;background:#f7fbff;color:#1768b5}
body{overflow-x:hidden}
.app-container{min-height:100vh;padding-bottom:88px}

/* الصورة العلوية */
.profile-hero{
    width:100%;
    background:#3476df;
    border-radius:0 0 18px 18px;
    overflow:hidden;
}
.profile-hero img{
    display:block;
    width:100%;
    height:auto;
    max-height:420px;
    object-fit:cover;
}

/* الأزرار الزرقاء تحت الصورة */
.quick-links{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    background:#3476df;
    color:#fff;
    padding:12px 8px 14px;
}
.quick-link{
    text-decoration:none;
    color:#fff;
    text-align:center;
    font-weight:700;
    font-size:15px;
    padding:7px 3px;
}
.quick-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    height:42px;
    font-size:29px;
    margin-bottom:3px;
}

/* الفيديو */
.video-section{
    padding:14px 10px 10px;
}
.video-box{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.10);
}
.video-box video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}
.video-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:58px;
    pointer-events:none;
    background:rgba(0,0,0,.18);
}

/* الموظفون */
.section-title{
    margin:8px 10px 0;
    background:#3476df;
    color:#fff;
    border-radius:12px 12px 0 0;
    text-align:center;
    font-size:23px;
    font-weight:800;
    padding:8px;
}
.employee-wrap{
    padding:8px 0 12px;
    background:#fff;
}
.employee-list{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:0 10px 8px;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    direction:ltr;
}
.employee-list::-webkit-scrollbar{display:none}
.employee-card{
    flex:0 0 135px;
    direction:rtl;
    background:#fff;
    border:1px solid #edf0f5;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.09);
    min-height:82px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:7px;
}
.employee-avatar{
    width:46px;height:46px;border-radius:50%;
    object-fit:cover;
    background:#eee;
}
.employee-info{text-align:center;line-height:1.35}
.employee-id{font-weight:700;color:#222;font-size:15px}
.employee-money{font-weight:800;color:#175bb2;font-size:16px}

/* شريط التنقل السفلي: محفوظ بنفس الأيقونات والأسماء */
.bottom-nav{
    position:fixed;
    right:0;left:0;bottom:0;
    height:82px;
    background:#fff;
    border-top:1px solid #e4e4e4;
    display:flex;
    align-items:stretch;
    justify-content:space-around;
    z-index:1000;
}
.nav-item{
    flex:1;
    min-width:0;
    text-decoration:none;
    color:#aaa;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    font-size:12px;
    font-weight:700;
}
.nav-item.active{color:#3476df}
.nav-icon{font-size:30px;line-height:1}
.nav-label{white-space:nowrap}
.center-btn .nav-icon{
    width:62px;height:62px;
    margin-top:-25px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#bcbcbc;
    color:#fff;
    box-shadow:0 2px 7px rgba(0,0,0,.15);
}
.center-btn{justify-content:flex-end;padding-bottom:4px}

@media (min-width:700px){
    .app-container{max-width:600px;margin:auto;background:#f7fbff}
    .bottom-nav{max-width:600px;margin:auto}
}
</style>
</head>

<body>
<div class="app-container">

    <!-- ارفع الصورة العلوية باسم: profile-top.jpg -->
    <section class="profile-hero">
        <img src="profile-top.jpg" alt="الصورة العلوية">
        <div class="quick-links">
            <a class="quick-link" href="#">
                <div class="quick-icon">◉</div>
                مركز المساعدة
            </a>
            <a class="quick-link" href="#">
                <div class="quick-icon">▤</div>
                منع الاحتيال
            </a>
            <a class="quick-link" href="#">
                <div class="quick-icon">▣</div>
                فيديو تعليمي
            </a>
        </div>
    </section>

    <!-- ارفع الفيديو باسم: profile-video.mp4 -->
    <section class="video-section">
        <div class="video-box">
            <video controls playsinline preload="metadata">
                <source src="profile-video.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
            <div class="video-placeholder">▶</div>
        </div>
    </section>

    <section>
        <div class="section-title">موظف</div>
        <div class="employee-wrap">
            <div class="employee-list" id="employeeList">
                <div class="employee-card">
                    <div class="employee-info"><div class="employee-id">••••7672</div><div class="employee-money">$354</div></div>
                </div>
                <div class="employee-card">
                    <div class="employee-info"><div class="employee-id">••••4075</div><div class="employee-money">$220</div></div>
                </div>
                <div class="employee-card">
                    <div class="employee-info"><div class="employee-id">••••8007</div><div class="employee-money">$953</div></div>
                </div>
                <div class="employee-card">
                    <div class="employee-info"><div class="employee-id">••••1268</div><div class="employee-money">$481</div></div>
                </div>
                <div class="employee-card">
                    <div class="employee-info"><div class="employee-id">••••6391</div><div class="employee-money">$720</div></div>
                </div>
            </div>
        </div>
    </section>

    <nav class="bottom-nav">
        <a href="profile.html" class="nav-item active">
            <span class="nav-icon">👤</span>
            <span class="nav-label">المركز الشخصي</span>
        </a>
        <a href="videos.html" class="nav-item">
            <span class="nav-icon">📊</span>
            <span class="nav-label">السجل</span>
        </a>
        <a href="shorts.html" class="nav-item center-btn">
            <span class="nav-icon">➕</span>
        </a>
        <a href="employment.html" class="nav-item">
            <span class="nav-icon">💌</span>
            <span class="nav-label">التوظيف</span>
        </a>
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">الصفحة الرئيسية</span>
        </a>
    </nav>
</div>

<script>
/* حركة بطيئة تلقائية + يمكن السحب يمين/يسار باللمس */
const list = document.getElementById('employeeList');
let paused = false;
let direction = 1;

list.addEventListener('touchstart', () => paused = true, {passive:true});
list.addEventListener('touchend', () => setTimeout(() => paused = false, 1200), {passive:true});
list.addEventListener('mousedown', () => paused = true);
list.addEventListener('mouseup', () => setTimeout(() => paused = false, 1200));

setInterval(() => {
    if (paused) return;
    if (list.scrollWidth <= list.clientWidth) return;

    list.scrollLeft += direction * 0.7;

    const max = list.scrollWidth - list.clientWidth;
    if (list.scrollLeft >= max - 1) direction = -1;
    if (list.scrollLeft <= 1) direction = 1;
}, 35);
</script>
</body>
</html>
