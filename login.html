<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GENAl - Login</title>
<style>
:root{
  --blue:#1f5fd2;
  --blue2:#5f9bea;
  --ink:#151515;
  --panel:rgba(220,231,250,.86);
  --line:#d8e1ef;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    linear-gradient(55deg,transparent 0 20%,rgba(221,229,242,.55) 20% 29%,transparent 29% 48%,rgba(226,234,247,.55) 48% 58%,transparent 58%),
    linear-gradient(125deg,transparent 0 66%,rgba(111,181,234,.68) 66% 79%,transparent 79%),
    #fff;
}
.app{width:min(100%,720px);margin:auto;min-height:100vh;padding:18px 20px 28px}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:44px;font-weight:900;letter-spacing:-2px;color:#155bd1}
.lang-area{position:relative;display:flex;align-items:center;gap:16px}
.lang-btn{
  width:58px;height:58px;border:0;background:transparent;border-radius:50%;
  font-size:38px;cursor:pointer;padding:0;
}
.refresh{font-size:36px;font-weight:700;line-height:1;transform:rotate(-20deg);opacity:.95}
.country-menu{
  position:absolute;right:0;top:64px;width:265px;max-height:65vh;overflow:auto;
  background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 12px 35px rgba(0,0,0,.16);padding:8px;display:none;z-index:20
}
.country-menu.open{display:block}
.country-option{
  width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:0;background:#fff;border-radius:10px;text-align:left;cursor:pointer;font-size:16px
}
.country-option:hover{background:#eef5ff}
.flag{font-size:28px;width:38px;text-align:center}
.country-name{flex:1}
.country-ar{font-size:13px;color:#777;display:block;margin-top:2px}
.heading{font-size:52px;font-weight:800;margin:78px 4px 34px}
.panel{
  background:var(--panel);border-radius:28px;padding:30px 28px 28px;
  border:1px solid rgba(200,215,238,.7)
}
.label{font-size:25px;font-weight:700;margin:0 0 12px}
.field{
  height:74px;background:#fff;border:1px solid #eef2f7;border-radius:7px;
  display:flex;align-items:center;padding:0 18px;margin-bottom:28px
}
.phone-code{
  display:flex;align-items:center;gap:10px;font-size:25px;white-space:nowrap;
  border:0;background:transparent;cursor:pointer;padding:0 12px 0 0
}
.code-arrow{font-size:23px}
.phone-input,.text-input{
  flex:1;border:0;outline:0;background:transparent;font-size:25px;min-width:0;
  color:#222
}
.phone-input::placeholder,.text-input::placeholder{color:#aaa}
.password-field{padding-right:20px}
.eye{
  width:40px;height:40px;border:0;background:transparent;font-size:31px;cursor:pointer;
  padding:0;margin-left:8px
}
.remember-row{display:flex;align-items:center;gap:18px;color:#155bd1;font-size:23px;font-weight:700}
.switch{position:relative;width:72px;height:42px;background:#999;border-radius:30px;cursor:pointer}
.switch i{position:absolute;width:34px;height:34px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.18s}
.switch.on{background:#1f5fd2}.switch.on i{left:34px}
.main-btn{
  width:100%;height:78px;margin-top:58px;border:0;border-radius:40px;
  background:linear-gradient(90deg,#71a8ee,#76a7eb);color:#fff;font-size:27px;cursor:pointer
}
.main-btn.enabled{background:linear-gradient(90deg,#2f78df,#5d98e8)}
.member{font-size:23px;text-align:center;margin-top:28px}
.member a{color:#155bd1;text-decoration:none;font-weight:500;cursor:pointer}
.version{text-align:center;font-size:18px;margin-top:34px}
.error{color:#d51616;font-size:17px;margin:-16px 0 18px;font-weight:700;min-height:20px}
.notice{color:#d51616;font-size:18px;font-weight:700;text-align:center;margin-top:18px;min-height:24px}
.register-panel{padding-bottom:22px}
.register-title{font-size:45px;font-weight:800;margin:44px 0 30px}
.invite-note{font-size:14px;color:#666;margin-top:-17px;margin-bottom:20px}
.agree{display:flex;align-items:flex-start;gap:12px;font-size:18px;line-height:1.45;margin-top:4px}
.agree input{width:25px;height:25px;margin-top:2px;accent-color:#2f78df}
.agree a{color:#155bd1;text-decoration:none}
.hidden{display:none!important}
.small-arrow{font-size:28px;color:#444}
.country-code-menu{
  position:absolute;left:20px;top:68px;width:250px;max-height:48vh;overflow:auto;background:#fff;
  border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.14);
  display:none;z-index:25;padding:7px
}
.country-code-menu.open{display:block}
.code-option{
  width:100%;border:0;background:#fff;text-align:left;padding:10px;border-radius:9px;
  font-size:16px;cursor:pointer
}
.code-option:hover{background:#eef5ff}
.success{color:#1760d0;font-size:18px;font-weight:700;text-align:center;margin-top:14px;min-height:22px}
@media(max-width:560px){
  .app{padding:16px 20px 26px}
  .logo{font-size:42px}
  .heading{font-size:46px;margin-top:68px;margin-bottom:30px}
  .panel{border-radius:25px;padding:26px 22px}
  .label{font-size:23px}.field{height:70px}
  .phone-code,.phone-input,.text-input{font-size:22px}
  .main-btn{height:72px;font-size:25px;margin-top:50px}
  .member{font-size:20px}.version{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">ACCE</div>
    <div class="lang-area">
      <button id="langBtn" class="lang-btn" aria-label="Language">🇦🇺</button>
      <div class="refresh">↻</div>
      <div id="countryMenu" class="country-menu"></div>
    </div>
  </div>

  <section id="loginPage">
    <h1 id="loginTitle" class="heading">Log in</h1>
    <div class="panel">
      <p id="phoneLabel" class="label">Phone number</p>
      <div class="field" style="position:relative">
        <button id="codeBtn" class="phone-code" type="button"><span id="codeText">+964</span><span class="code-arrow">⌄</span></button>
        <input id="phone" class="phone-input" inputmode="numeric" autocomplete="tel" placeholder="Phone number" maxlength="11">
        <div id="codeMenu" class="country-code-menu"></div>
      </div>
      <div id="phoneError" class="error"></div>

      <p id="passwordLabel" class="label">Password</p>
      <div class="field password-field">
        <input id="password" class="text-input" type="password" autocomplete="current-password" placeholder="password" maxlength="8">
        <button id="eye" class="eye" type="button" aria-label="Show password">◉</button>
      </div>
      <div id="passwordError" class="error"></div>

      <div class="remember-row">
        <span id="rememberText">Remember password</span>
        <button id="switch" class="switch" type="button" aria-label="Remember password"><i></i></button>
      </div>
    </div>

    <button id="loginBtn" class="main-btn" type="button">Log in</button>
    <div id="loginNotice" class="notice"></div>
    <div class="member"><span id="notMember">Not A Member?</span> <a id="registerLink">Register Now</a></div>
    <div class="version">version number: 1.0.3.1</div>
  </section>

  <section id="registerPage" class="hidden">
    <h1 id="registerTitle" class="register-title">Register User</h1>
    <div class="panel register-panel">
      <p id="rPhoneLabel" class="label">Phone number</p>
      <div class="field" style="position:relative">
        <button id="rCodeBtn" class="phone-code" type="button"><span id="rCodeText">+964</span><span class="code-arrow">⌄</span></button>
        <input id="rPhone" class="phone-input" inputmode="numeric" autocomplete="tel" placeholder="Phone number" maxlength="11">
        <div id="rCodeMenu" class="country-code-menu"></div>
      </div>
      <div id="rPhoneError" class="error"></div>

      <p id="rPasswordLabel" class="label">Password</p>
      <div class="field password-field">
        <input id="rPassword" class="text-input" type="password" placeholder="Enter password" maxlength="8">
        <button id="rEye" class="eye" type="button">◉</button>
      </div>
      <div id="rPasswordError" class="error"></div>

      <p id="confirmLabel" class="label">Confirm password</p>
      <div class="field password-field">
        <input id="rConfirm" class="text-input" type="password" placeholder="Please confirm password" maxlength="8">
        <button id="rConfirmEye" class="eye" type="button">◉</button>
      </div>
      <div id="rConfirmError" class="error"></div>

      <p id="captchaLabel" class="label">Official captcha</p>
      <div class="field">
        <input id="captcha" class="text-input" placeholder="Enter verification code: FJ18" maxlength="4">
      </div>
      <div id="captchaError" class="error"></div>

      <p id="inviteLabel" class="label">Invitation code</p>
      <div class="field">
        <input id="invite" class="text-input" placeholder="Please enter invitation code" maxlength="3">
      </div>
      <div class="invite-note">Invitation code: 3 characters</div>
      <div id="inviteError" class="error"></div>

      <label class="agree">
        <input id="agree" type="checkbox">
        <span><span id="agreeArabic">أقر بأنني أوافق وألتزم</span><br><a href="#" onclick="return false">Enrollment Agreement</a></span>
      </label>
    </div>

    <button id="registerBtn" class="main-btn" type="button">Register Now</button>
    <div id="registerNotice" class="notice"></div>
  </section>
</div>

<script>
(function(){
  const HOME = 'index.html';
  const AUTH_KEY = 'genai_login_data_v1';

  const countries = [
    {flag:'🇦🇺', name:'Australia', code:'+61', lang:'en'},
    {flag:'🇺🇸', name:'United States', code:'+1', lang:'en'},
    {flag:'🇬🇧', name:'United Kingdom', code:'+44', lang:'en'},
    {flag:'🇨🇦', name:'Canada', code:'+1', lang:'en'},
    {flag:'🇩🇪', name:'Germany', code:'+49', lang:'en'},
    {flag:'🇫🇷', name:'France', code:'+33', lang:'en'},
    {flag:'🇮🇹', name:'Italy', code:'+39', lang:'en'},
    {flag:'🇪🇸', name:'Spain', code:'+34', lang:'en'},
    {flag:'🇹🇷', name:'Turkey', code:'+90', lang:'en'},
    {flag:'🇸🇦', name:'Saudi Arabia', code:'+966', lang:'en'},
    {flag:'🇶🇦', name:'Qatar', code:'+974', lang:'en'},
    {flag:'🇰🇼', name:'Kuwait', code:'+965', lang:'en'},
    {flag:'🇦🇪', name:'الإمارات العربية المتحدة', code:'+971', lang:'ar'},
    {flag:'🇮🇶', name:'Iraq', code:'+964', lang:'ar'}
  ];

  let selected = countries[0];
  let selectedCode = '+964';
  let remembered = false;

  const $ = id => document.getElementById(id);
  const countryMenu = $('countryMenu');
  const codeMenu = $('codeMenu');
  const rCodeMenu = $('rCodeMenu');

  function renderCountries(){
    countryMenu.innerHTML = countries.map((c,i)=>`
      <button class="country-option" type="button" data-i="${i}">
        <span class="flag">${c.flag}</span>
        <span class="country-name">${c.name}<span class="country-ar">${c.lang==='ar'?'العربية':'English'}</span></span>
      </button>`).join('');
    countryMenu.querySelectorAll('.country-option').forEach(b=>{
      b.onclick=()=>{ selectCountry(+b.dataset.i); countryMenu.classList.remove('open'); };
    });
  }

  function renderCodes(menu, setter){
    menu.innerHTML = countries.map(c=>`
      <button class="code-option" type="button" data-code="${c.code}">${c.code}</button>`).join('');
    menu.querySelectorAll('.code-option').forEach(b=>{
      b.onclick=()=>{ setter(b.dataset.code); menu.classList.remove('open'); };
    });
  }

  function selectCountry(i){
    selected = countries[i];
    $('langBtn').textContent = selected.flag;
    document.documentElement.lang = selected.lang==='ar'?'ar':'en';
    if(selected.lang==='ar'){
      document.documentElement.dir='rtl';
    }else{
      document.documentElement.dir='ltr';
    }
    // Only the selected UAE entry is Arabic; other foreign countries remain English.
    if(selected.name.includes('الإمارات')){
      applyArabicLabels();
    }else{
      applyEnglishLabels();
    }
    selectedCode = selected.code;
    $('codeText').textContent = selected.code;
    $('rCodeText').textContent = selected.code;
  }

  function applyEnglishLabels(){
    $('loginTitle').textContent='Log in';
    $('phoneLabel').textContent='Phone number';
    $('passwordLabel').textContent='Password';
    $('rememberText').textContent='Remember password';
    $('notMember').textContent='Not A Member?';
    $('registerLink').textContent='Register Now';
    $('loginBtn').textContent='Log in';
    $('rPhoneLabel').textContent='Phone number';
    $('rPasswordLabel').textContent='Password';
    $('confirmLabel').textContent='Confirm password';
    $('captchaLabel').textContent='Official captcha';
    $('inviteLabel').textContent='Invitation code';
    $('agreeArabic').textContent='I agree and accept';
    $('registerBtn').textContent='Register Now';
  }

  function applyArabicLabels(){
    $('loginTitle').textContent='تسجيل الدخول';
    $('phoneLabel').textContent='رقم التلفون';
    $('passwordLabel').textContent='كلمة المرور';
    $('rememberText').textContent='تذكر كلمة المرور';
    $('notMember').textContent='ليس لديك حساب؟';
    $('registerLink').textContent='سجل الآن';
    $('loginBtn').textContent='تسجيل الدخول';
    $('rPhoneLabel').textContent='رقم التلفون';
    $('rPasswordLabel').textContent='كلمة المرور';
    $('confirmLabel').textContent='تأكيد كلمة المرور';
    $('captchaLabel').textContent='الكابتشا الرسمية';
    $('inviteLabel').textContent='رمز الدعوة';
    $('agreeArabic').textContent='أقر بأنني أوافق وألتزم';
    $('registerBtn').textContent='تسجيل الآن';
  }

  function showLogin(){ $('loginPage').classList.remove('hidden'); $('registerPage').classList.add('hidden'); }
  function showRegister(){ $('loginPage').classList.add('hidden'); $('registerPage').classList.remove('hidden'); window.scrollTo(0,0); }

  function validatePhone(v){
    return /^\\d{11}$/.test(v);
  }
  function validatePassword(v){
    return /^[A-Za-z0-9]{8}$/.test(v);
  }
  function setError(id,msg){ $(id).textContent=msg||''; }

  $('langBtn').onclick=()=>countryMenu.classList.toggle('open');
  document.addEventListener('click',e=>{
    if(!e.target.closest('.lang-area')) countryMenu.classList.remove('open');
    if(!e.target.closest('#codeBtn') && !e.target.closest('#codeMenu')) codeMenu.classList.remove('open');
    if(!e.target.closest('#rCodeBtn') && !e.target.closest('#rCodeMenu')) rCodeMenu.classList.remove('open');
  });

  $('codeBtn').onclick=e=>{e.stopPropagation();codeMenu.classList.toggle('open')};
  $('rCodeBtn').onclick=e=>{e.stopPropagation();rCodeMenu.classList.toggle('open')};
  renderCodes(codeMenu,c=>{$('codeText').textContent=c;selectedCode=c});
  renderCodes(rCodeMenu,c=>{$('rCodeText').textContent=c});
  renderCountries();

  $('switch').onclick=()=>{ remembered=!remembered; $('switch').classList.toggle('on',remembered); };

  function eye(btn,input){
    btn.onclick=()=>{input.type=input.type==='password'?'text':'password'};
  }
  eye($('eye'),$('password'));
  eye($('rEye'),$('rPassword'));
  eye($('rConfirmEye'),$('rConfirm'));

  $('registerLink').onclick=showRegister;

  $('loginBtn').onclick=()=>{
    setError('phoneError',''); setError('passwordError',''); $('loginNotice').textContent='';
    const phone=$('phone').value.trim(), pass=$('password').value;
    let ok=true;
    if(selectedCode==='+964' && !validatePhone(phone)){
      setError('phoneError','Invalid phone number'); ok=false;
    }
    if(!validatePassword(pass)){
      setError('passwordError','Invalid password'); ok=false;
    }
    if(!ok) return;

    const saved=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');
    if(saved && saved.code===selectedCode && saved.phone===phone && saved.password===pass){
      if(remembered) localStorage.setItem(AUTH_KEY,JSON.stringify(saved));
      window.location.href=HOME;
    }else{
      $('loginNotice').textContent='You do not have a GENAl account';
    }
  };

  $('registerBtn').onclick=()=>{
    ['rPhoneError','rPasswordError','rConfirmError','captchaError','inviteError'].forEach(id=>setError(id,''));
    $('registerNotice').textContent='';
    const phone=$('rPhone').value.trim();
    const pass=$('rPassword').value;
    const conf=$('rConfirm').value;
    const captcha=$('captcha').value.trim().toUpperCase();
    const invite=$('invite').value.trim();
    let ok=true;

    if($('rCodeText').textContent==='+964' && !validatePhone(phone)){
      setError('rPhoneError','Invalid phone number'); ok=false;
    }
    if(!validatePassword(pass)){ setError('rPasswordError','Invalid password'); ok=false; }
    if(conf!==pass){ setError('rConfirmError','Password does not match'); ok=false; }
    if(captcha!=='FJ18'){ setError('captchaError','Invalid captcha'); ok=false; }
    if(!/^[A-Za-z0-9]{3}$/.test(invite)){ setError('inviteError','Invitation code must be 3 characters'); ok=false; }
    if(!$('agree').checked){ $('registerNotice').textContent='Please accept the Enrollment Agreement'; ok=false; }
    if(!ok) return;

    const data={code:$('rCodeText').textContent,phone,password:pass,invite,remembered:true};
    localStorage.setItem(AUTH_KEY,JSON.stringify(data));
    window.location.href=HOME;
  };

  $('phone').addEventListener('input',()=>{$('phone').value=$('phone').value.replace(/\\D/g,'').slice(0,11)});
  $('rPhone').addEventListener('input',()=>{$('rPhone').value=$('rPhone').value.replace(/\\D/g,'').slice(0,11)});
  $('password').addEventListener('input',()=>{$('password').value=$('password').value.replace(/[^A-Za-z0-9]/g,'').slice(0,8)});
  $('rPassword').addEventListener('input',()=>{$('rPassword').value=$('rPassword').value.replace(/[^A-Za-z0-9]/g,'').slice(0,8)});
  $('rConfirm').addEventListener('input',()=>{$('rConfirm').value=$('rConfirm').value.replace(/[^A-Za-z0-9]/g,'').slice(0,8)});
  $('invite').addEventListener('input',()=>{$('invite').value=$('invite').value.slice(0,3)});
})();
</script>
</body>
</html>
