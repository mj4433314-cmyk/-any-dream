<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCE - Log in</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,"Segoe UI",sans-serif;background:#fff;color:#171717}
body{overflow-x:hidden}
.page{min-height:100vh;position:relative;padding:28px 7.5vw 55px;background:linear-gradient(55deg,transparent 0 8%,rgba(217,232,249,.28) 8.5% 12%,transparent 12.5% 39%,rgba(219,232,247,.48) 39.5% 45%,transparent 45.5% 100%),linear-gradient(125deg,#fff 0 64%,#f5faff 64.5% 78%,#6db8ea 78.5% 100%)}
.top{display:flex;justify-content:space-between;align-items:flex-start}.logo{font-size:42px;font-weight:800;color:#1261c9;letter-spacing:-2px}.tools{display:flex;gap:24px;align-items:center}.flag{width:43px;height:43px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 3px #777}.refresh{font-size:40px;line-height:1;color:#111;transform:rotate(-35deg);cursor:pointer}
h1{font-size:44px;margin:72px 0 42px;font-weight:700;letter-spacing:-1px}.form-card{background:rgba(220,233,250,.72);border-radius:25px;padding:38px 34px 32px;box-shadow:0 1px 1px rgba(100,130,170,.04)}
label{display:block;font-size:22px;font-weight:600;margin-bottom:13px}.field{height:64px;background:#fff;border:0;border-radius:7px;width:100%;padding:0 18px;font-size:20px;outline:none}.phone-row{display:flex;align-items:center;gap:12px}.code{white-space:nowrap;font-size:20px;color:#222}.chev{font-size:18px}.phone-input{flex:1;border:0;outline:0;font-size:20px;min-width:0}.group{margin-bottom:38px}.password-wrap{position:relative}.password-wrap .field{padding-right:60px}.eye{position:absolute;right:19px;top:50%;transform:translateY(-50%);width:22px;height:15px;border:3px solid #222;border-radius:70% 20%;cursor:pointer}.eye:after{content:"";position:absolute;width:7px;height:7px;border:2px solid #222;border-radius:50%;left:4px;top:1px}
.remember{display:flex;align-items:center;gap:12px;color:#1261c9;font-size:18px;font-weight:600;margin-top:-12px;cursor:pointer}.switch{width:55px;height:30px;background:#999;border-radius:20px;position:relative;display:inline-block}.switch:after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:#78aaf0}.switch.on:after{left:28px}
.login{margin-top:40px;width:100%;height:65px;border:0;border-radius:35px;background:#78aaf0;color:white;font-size:21px;cursor:pointer}.login:disabled{opacity:.65;cursor:wait}.error{text-align:center;color:#d33;font-size:16px;font-weight:600;min-height:22px;margin-top:14px}.register{text-align:center;margin-top:24px;font-size:19px}.register a{color:#1766c8;text-decoration:none}.version{text-align:center;margin-top:25px;font-size:17px}
@media(max-width:600px){.page{padding:20px 7vw 45px}.logo{font-size:34px}.flag{width:35px;height:35px}.refresh{font-size:32px}h1{font-size:38px;margin:58px 0 32px}.form-card{padding:28px 22px}label{font-size:18px}.field{height:58px;font-size:17px}.group{margin-bottom:30px}.remember{font-size:16px}.login{height:58px;font-size:19px}.register{font-size:16px}.version{font-size:14px}}
</style>
</head>
<body>
<div class="page">
  <div class="top"><div class="logo">ACCE</div><div class="tools"><img class="flag" src="https://flagcdn.com/w80/gb.png" alt="English"><div class="refresh" onclick="location.reload()">↻</div></div></div>
  <h1>Log in</h1>
  <form id="loginForm" novalidate>
    <div class="form-card">
      <div class="group"><label for="phone">Phone number</label><div class="field phone-row"><span class="code">+964</span><span class="chev">⌄</span><input id="phone" class="phone-input" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Phone number"></div></div>
      <div class="group"><label for="password">Password</label><div class="password-wrap"><input class="field" id="password" type="password" autocomplete="current-password" placeholder="password"><span class="eye" onclick="togglePassword('password',this)"></span></div></div>
      <div class="remember" id="rememberRow" role="switch" aria-checked="false" tabindex="0"><span>Remember password</span><span class="switch" id="rememberSwitch"></span></div>
    </div>
    <div id="error" class="error" aria-live="polite"></div>
    <button class="login" id="loginBtn" type="submit">Log in</button>
  </form>
  <div class="register">Not A Member? &nbsp;<a href="register.html">Register Now</a></div>
  <div class="version">version number: &nbsp; 1.0.3.1</div>
</div>
<script>
(function(){
  const SESSION_KEY='acce_logged_in_v1';
  if (localStorage.getItem(SESSION_KEY)) { window.location.replace('index.html'); return; }
  const PHONE_KEY='acce_login_phone_v1', PASS_KEY='acce_login_password_v1', REM_KEY='acce_remember_password_v1';
  const phone=document.getElementById('phone'),password=document.getElementById('password'),rememberRow=document.getElementById('rememberRow'),rememberSwitch=document.getElementById('rememberSwitch'),error=document.getElementById('error'),btn=document.getElementById('loginBtn');
  let remember=localStorage.getItem(REM_KEY)==='1';
  function setRemember(v){remember=v;rememberSwitch.classList.toggle('on',v);rememberRow.setAttribute('aria-checked',String(v));if(v)localStorage.setItem(REM_KEY,'1');else localStorage.removeItem(REM_KEY)}
  if(remember){phone.value=localStorage.getItem(PHONE_KEY)||'';password.value=localStorage.getItem(PASS_KEY)||''} setRemember(remember);
  rememberRow.addEventListener('click',()=>setRemember(!remember));rememberRow.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setRemember(!remember)}});
  document.getElementById('loginForm').addEventListener('submit',function(e){
    e.preventDefault(); error.textContent='';
    const p=phone.value.replace(/\D/g,''); const pw=password.value;
    if(p.length<7){error.textContent='Please enter a valid phone number.';return}
    if(!pw){error.textContent='Please enter your password.';return}
    btn.disabled=true;btn.textContent='Logging in...';
    if(remember){localStorage.setItem(PHONE_KEY,p);localStorage.setItem(PASS_KEY,pw)}else{localStorage.removeItem(PHONE_KEY);localStorage.removeItem(PASS_KEY)}
    localStorage.setItem(SESSION_KEY,JSON.stringify({phone:'+964'+p,loginAt:Date.now()}));
    setTimeout(()=>{window.location.href='index.html'},250);
  });
})();
function togglePassword(id,el){const input=document.getElementById(id);input.type=input.type==='password'?'text':'password'}
</script>
</body>
</html>
