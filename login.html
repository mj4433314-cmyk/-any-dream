<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8fc9f0"><title>ACCE - Log in</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Segoe UI",sans-serif;color:#111;background:#fff}
body{overflow-x:hidden}
.page{
 min-height:100vh;padding-bottom:34px;position:relative;overflow:hidden;
 background:
  linear-gradient(56deg,transparent 0 10%,rgba(218,231,247,.62) 10.2% 18%,transparent 18.3% 45%,rgba(213,226,243,.68) 45.2% 54%,transparent 54.3% 100%),
  linear-gradient(126deg,#fff 0 54%,#f4f8fd 54.4% 70%,#8fc9f0 70.4% 100%);
}
.page:before,.page:after{content:"";position:absolute;pointer-events:none;z-index:0}
.page:before{width:130%;height:150px;left:-18%;top:360px;background:rgba(255,255,255,.40);transform:rotate(52deg)}
.page:after{width:100%;height:220px;left:-42%;bottom:60px;background:rgba(201,221,243,.48);transform:rotate(52deg)}
.header{height:128px;padding:23px 7.5vw 12px;display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.logo{font-size:44px;font-weight:900;color:#1465c9;letter-spacing:-3px;line-height:1}
.tools{display:flex;gap:21px;align-items:center}
.flag-btn{width:57px;height:57px;border:2px solid #fff;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2);font-size:34px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.refresh{font-size:39px;line-height:1;cursor:pointer;color:#111;transform:rotate(-35deg)}
.content{position:relative;z-index:1}
h1{font-size:45px;line-height:1.2;margin:45px 7.5vw 42px;font-weight:700;letter-spacing:-1px}
.form-card{margin:0 6.8vw;background:rgba(220,233,250,.82);border-radius:28px;padding:29px 32px 29px;border:1px solid rgba(255,255,255,.85)}
.group{margin-bottom:31px}
label{display:block;font-size:23px;font-weight:700;margin:0 0 14px}
.field{height:61px;width:100%;border:0;border-radius:7px;background:#fff;outline:none;padding:0 22px;font-size:20px;color:#222}
.field::placeholder{color:#9a9a9a}
.phone-row{display:flex;align-items:center;direction:ltr;padding:0 20px}
.code-select{height:52px;border:0;background:#fff;font-size:21px;display:flex;gap:10px;align-items:center;cursor:pointer;direction:ltr;white-space:nowrap}
.phone-input{flex:1;min-width:0;border:0;outline:0;background:#fff;height:52px;font-size:20px;padding:0 8px;direction:ltr;text-align:left}
.password-wrap{position:relative}
.password-wrap .field{padding-right:65px;direction:ltr;text-align:left}
.eye{position:absolute;right:23px;top:50%;width:29px;height:19px;border:3px solid #111;border-radius:70% 45%;transform:translateY(-50%) rotate(-2deg);cursor:pointer}
.eye:after{content:"";position:absolute;width:8px;height:8px;border:2px solid #111;border-radius:50%;left:7px;top:2px}
.captcha-row{display:flex;direction:ltr;gap:12px}
.captcha-input{flex:1;direction:rtl;text-align:right}
.captcha-box{width:135px;border:0;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;letter-spacing:2px;cursor:pointer}
.invite-hint{display:none}
.terms{display:flex;align-items:flex-start;gap:11px;font-size:18px;font-weight:500;margin-top:0;direction:rtl}
.terms input{width:25px;height:25px;margin:0;accent-color:#fff;flex:none}
.terms .agreement{display:block}
.terms .ar-agreement{display:block;margin-bottom:2px}
.terms a{color:#1261c9;text-decoration:none;font-size:18px}
.error{text-align:center;color:#d22222;font-size:15px;min-height:20px;margin:12px 0 0}
.register-btn,.login-btn{width:100%;height:62px;margin-top:27px;border:0;border-radius:36px;background:linear-gradient(90deg,#72a9f1,#6f92e8);color:#fff;font-size:22px;cursor:pointer}
.bottom-link{text-align:center;font-size:21px;margin-top:30px}
.bottom-link a{color:#155cc6;text-decoration:none}
.version{text-align:center;font-size:18px;margin-top:18px;direction:ltr}
.remember-row{display:flex;align-items:center;gap:20px;margin-top:-3px;direction:ltr}
.remember-label{font-size:22px;color:#155cc6;font-weight:500}
.switch{width:94px;height:51px;background:#9a9aa3;border-radius:30px;position:relative;cursor:pointer}
.switch span{width:39px;height:39px;background:#fff;border-radius:50%;position:absolute;left:6px;top:6px;transition:.2s}
.switch.on{background:#6f98ec}
.switch.on span{left:49px}
.dropdown{display:none;position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.35);align-items:flex-end}
.dropdown.open{display:flex}
.sheet{width:100%;max-height:78vh;background:#fff;border-radius:24px 24px 0 0;padding:14px 16px 24px;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;padding-bottom:10px;position:sticky;top:0;background:#fff;z-index:2}
.close{border:0;background:#edf4ff;border-radius:10px;padding:9px 14px;cursor:pointer}
.search{width:100%;height:50px;border:1px solid #ddd;border-radius:10px;padding:0 14px;font-size:17px;margin-bottom:8px;outline:none}
.country-option,.flag-option{width:100%;min-height:53px;border:0;border-bottom:1px solid #eee;background:#fff;display:flex;align-items:center;gap:12px;padding:8px 6px;cursor:pointer;font-size:16px;direction:ltr;text-align:left}
.country-option .cname,.flag-option span:nth-child(2){flex:1}
.country-option b{font-size:16px}
.cflag{font-size:23px}.flag-option span:first-child{font-size:25px}
.notice{font-size:13px;color:#777;margin:0 0 10px}
@media(max-width:600px){
 .header{height:126px;padding:22px 7.5vw 10px}
 .logo{font-size:41px}.flag-btn{width:55px;height:55px;font-size:32px}.refresh{font-size:36px}
 h1{font-size:42px;margin:45px 7.5vw 40px}
 .form-card{margin:0 6.8vw;padding:29px 31px}
 label{font-size:22px}.field{height:61px;font-size:19px}
 .code-select{font-size:20px}.phone-input{font-size:19px}
 .captcha-box{width:132px}
 .register-btn,.login-btn{height:62px}
}
</style></head>

<div id="error" class="error"></div>
</div><button class="login-btn" type="submit">Log in</button></form>
