<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCE - Log in</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#fff;color:#111}body{min-height:100vh;overflow-x:hidden;background:linear-gradient(125deg,#fff 0%,#fff 62%,#eaf6ff 100%)}
body:after{content:"";position:fixed;right:-120px;bottom:-100px;width:360px;height:330px;background:linear-gradient(135deg,transparent 48%,#73bce8 49%,#54aee0 100%);z-index:-1;opacity:.9}
.top{height:170px;padding:38px 48px 0;display:flex;align-items:flex-start;justify-content:space-between}.logo{font-size:66px;font-weight:800;color:#1469bd;letter-spacing:-4px}.actions{display:flex;align-items:center;gap:48px}.flag{width:68px;height:68px;border-radius:50%;object-fit:cover;box-shadow:0 2px 7px #aaa}.refresh{font-size:52px;font-weight:300;line-height:1;transform:rotate(-35deg)}
main{padding:225px 48px 70px}.title{font-size:72px;font-weight:800;margin:0 0 65px}.card{background:rgba(221,234,251,.78);border-radius:48px;padding:54px 43px 45px;max-width:596px}.label{font-size:35px;font-weight:700;margin-bottom:26px}.input{height:112px;background:#fff;border-radius:16px;display:flex;align-items:center;padding:0 34px;margin-bottom:58px}.prefix{font-size:35px;white-space:nowrap}.arrow{font-size:28px;margin:0 20px}.input input{border:0;outline:0;width:100%;font-size:34px;color:#555;background:transparent}.input input::placeholder{color:#777}.password-wrap{position:relative}.password-wrap input{padding-right:55px}.eye{position:absolute;right:18px;top:32px;font-size:38px;cursor:pointer;font-weight:bold}.remember-row{display:flex;align-items:center;justify-content:space-between}.remember{font-size:31px;font-weight:700;color:#166cc0}.switch{width:108px;height:58px;border-radius:40px;background:#aaa;position:relative;cursor:pointer}.switch span{position:absolute;width:47px;height:47px;background:#fff;border-radius:50%;left:6px;top:5px;transition:.2s}.switch.on{background:#2478c8}.switch.on span{left:55px}.login{display:block;width:100%;max-width:596px;height:112px;margin:145px 0 0;border:0;border-radius:60px;background:#72a8e9;color:white;font-size:36px;cursor:pointer}.login:active{transform:scale(.99)}.error{display:none;color:#d22;font-size:22px;font-weight:700;margin-top:20px}.error.show{display:block}
@media(max-width:600px){.top{height:145px;padding:30px 25px 0}.logo{font-size:48px}.actions{gap:25px}.flag{width:55px;height:55px}.refresh{font-size:42px}main{padding:115px 48px 50px}.title{font-size:58px;margin-bottom:55px}.card{padding:45px 30px;border-radius:42px}.label{font-size:30px}.input{height:100px;padding:0 25px}.prefix{font-size:30px}.input input{font-size:28px}.remember{font-size:25px}.login{height:105px;margin-top:120px;font-size:32px}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">ACCE</div>
  <div class="actions"><img class="flag" src="https://flagcdn.com/w160/gb.png" alt="UK"><div class="refresh">↻</div></div>
</header>
<main>
  <h1 class="title">Log in</h1>
  <form id="loginForm" novalidate>
    <section class="card">
      <div class="label">Phone number</div>
      <div class="input">
        <span class="prefix">+964</span><span class="arrow">⌄</span>
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Phone number">
      </div>
      <div class="label">Password</div>
      <div class="input password-wrap">
        <input id="password" type="password" autocomplete="current-password" placeholder="password">
        <span class="eye" id="eye">@</span>
      </div>
      <div class="remember-row">
        <div class="remember">Remember password</div>
        <div class="switch" id="rememberSwitch" role="switch" aria-checked="false"><span></span></div>
      </div>
      <div class="error" id="error">Please enter your phone number and password.</div>
    </section>
    <button class="login" type="submit">Log in</button>
  </form>
</main>
<script>
const phone=document.getElementById('phone');
const password=document.getElementById('password');
const form=document.getElementById('loginForm');
const error=document.getElementById('error');
const rememberSwitch=document.getElementById('rememberSwitch');
const eye=document.getElementById('eye');

let remember=false;
try{
  const saved=localStorage.getItem('acce_login');
  if(saved){
    const data=JSON.parse(saved);
    if(data.phone) phone.value=data.phone;
    if(data.password) password.value=data.password;
    remember=true; rememberSwitch.classList.add('on'); rememberSwitch.setAttribute('aria-checked','true');
  }
}catch(e){}

rememberSwitch.addEventListener('click',()=>{
  remember=!remember;
  rememberSwitch.classList.toggle('on',remember);
  rememberSwitch.setAttribute('aria-checked',String(remember));
});

eye.addEventListener('click',()=>{
  password.type=password.type==='password'?'text':'password';
});

form.addEventListener('submit',(e)=>{
  e.preventDefault();
  const p=phone.value.trim();
  const pw=password.value;
  if(!p || !pw){
    error.classList.add('show');
    return;
  }
  error.classList.remove('show');
  if(remember){
    try{localStorage.setItem('acce_login',JSON.stringify({phone:p,password:pw}));}catch(e){}
  }else{
    try{localStorage.removeItem('acce_login');}catch(e){}
  }
  // Go directly to the original home page. No changes are made to index.html.
  window.location.href='./index.html';
});
</script>
</body>
</html>
