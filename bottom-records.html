<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السجلات - ACCE</title><link rel="stylesheet" href="styles.css">
<style id="records-only-fix">
.records-custom{padding:0 14px 105px;background:linear-gradient(145deg,#eef6ff 0%,#fff 48%,#edf7ff 100%);min-height:100vh}
.records-hero{margin:0 -14px;padding:16px 20px 22px;background:linear-gradient(135deg,#4c91ef,#3477dc);border-radius:0 0 28px 28px;box-shadow:0 4px 12px #2d63af26}
.records-hero h1{margin:0 0 14px;text-align:center;color:#fff;font-size:30px;font-weight:800}
.records-hero-row{display:flex;align-items:center;gap:12px}
.records-zero{flex:1;height:58px;border-radius:32px;background:#fff;color:#2461b9;display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:900}
.records-tutorial{width:42%;height:58px;border:0;border-radius:32px;background:#397be2;color:#fff;font-family:inherit;font-size:19px;font-weight:800}
.records-tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:26px 0 18px;background:rgba(255,255,255,.94)}
.records-tab{appearance:none;border:0;border-bottom:4px solid transparent;background:transparent;padding:0 3px 10px;min-height:70px;display:flex;align-items:center;justify-content:center;text-align:center;color:#111;font-family:inherit;font-size:18px;font-weight:700;line-height:1.35;cursor:pointer}
.records-tab.active{color:#397bdc;border-bottom-color:#397bdc}
.records-empty{height:540px;border-radius:24px;background:rgba(230,240,254,.88);box-shadow:0 2px 12px #2d63af14;display:flex;align-items:center;justify-content:center;overflow:hidden}
.records-empty svg{width:min(250px,58vw);height:auto;display:block;transform:translateY(-28px)}
.records-empty .s{fill:none;stroke:#397bdc;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:380px){.records-hero h1{font-size:28px}.records-tab{font-size:16px}.records-empty{height:520px}}
</style>
</head><body><div class="app">
<main class="records-custom">
<section class="records-hero">
<h1>الفرص المتاحة</h1>
<div class="records-hero-row">
<div class="records-zero">0/0</div>
<button class="records-tutorial" type="button">💡 Tutorial</button>
</div>
</section>

<section class="records-tabs" aria-label="حالة المهام">
<button class="records-tab" type="button">رفض</button>
<button class="records-tab" type="button">كامل</button>
<button class="records-tab" type="button">المهمة قيد<br>التقدم</button>
<button class="records-tab active" type="button">تم التراجع عنه</button>
</section>

<section class="records-empty" aria-label="لا توجد سجلات">
<svg viewBox="0 0 260 260" aria-hidden="true">
<path class="s" d="M73 45h103l28 28v133H73z"/>
<path class="s" d="M176 45v30h28"/>
<path class="s" d="M96 89h72M96 112h72M96 135h50M96 158h40"/>
<circle cx="164" cy="156" r="45" fill="#fff" stroke="#397bdc" stroke-width="5"/>
<path class="s" d="M197 190l28 28"/>
<path class="s" d="M151 142l26 26M177 142l-26 26"/>
<path class="s" d="M57 71l10 10M57 211l10-10M213 91l10-10"/>
</svg>
</section>
</main>
</div>
<script>
document.querySelectorAll('.records-tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.records-tab').forEach(function(t){t.classList.remove('active');});
    this.classList.add('active');
  });
});
</script>
