<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السجل</title>
<link rel="stylesheet" href="styles.css">
<style>
/* صفحة السجل فقط — الشريط السفلي خارج هذا التنسيق */
.records-page{
  min-height:calc(100vh - 78px);
  padding:0 14px 100px;
  box-sizing:border-box;
  background:
    linear-gradient(135deg,rgba(255,255,255,.96) 0 43%,rgba(222,235,252,.76) 43% 51%,rgba(255,255,255,.96) 51% 100%),
    #f7fbff;
}
.records-top{
  margin:0 -14px;
  padding:16px 20px 20px;
  background:linear-gradient(135deg,#4c91ef,#3477dc);
  border-radius:0 0 24px 24px;
  box-shadow:0 4px 12px rgba(45,99,175,.16);
}
.available-title{
  text-align:center;
  color:#fff;
  font-size:25px;
  font-weight:800;
  margin:0 0 12px;
}
.available-row{
  display:flex;
  align-items:center;
  gap:12px;
}
.available-count{
  flex:1;
  height:58px;
  border-radius:32px;
  background:#fff;
  color:#2461b9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:900;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.tutorial-btn{
  width:42%;
  height:58px;
  border:0;
  border-radius:32px;
  background:#397be2;
  color:#fff;
  font-size:19px;
  font-weight:800;
}
.records-tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  margin:24px 0 18px;
  background:rgba(255,255,255,.94);
}
.records-tab{
  min-height:66px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#111;
  font-size:18px;
  font-weight:700;
  line-height:1.35;
  border-bottom:3px solid transparent;
}
.records-tab.active{
  color:#397bdc;
  border-bottom-color:#397bdc;
}
.empty-records{
  min-height:540px;
  border-radius:22px;
  background:rgba(230,240,254,.86);
  box-shadow:0 2px 12px rgba(45,99,175,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.empty-art{
  width:min(240px,55vw);
  height:auto;
}
.empty-art .line{
  fill:none;
  stroke:#397bdc;
  stroke-width:5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.empty-art .fill{
  fill:#397bdc;
}
.empty-art .white{
  fill:#fff;
}
@media(max-width:520px){
  .records-page{padding-left:14px;padding-right:14px}
  .records-tab{font-size:16px}
  .empty-records{min-height:520px}
}
</style>
</head>
<body>
<div class="app">
<main class="records-page">
  <section class="records-top" aria-label="الفرص المتاحة">
    <h1 class="available-title">الفرص المتاحة</h1>
    <div class="available-row">
      <div class="available-count">0/0</div>
      <button class="tutorial-btn" type="button">💡 Tutorial</button>
    </div>
  </section>

  <section class="records-tabs" aria-label="حالة المهام">
    <div class="records-tab active">تم التراجع عنه</div>
    <div class="records-tab">المهمة قيد<br>التقدم</div>
    <div class="records-tab">كامل</div>
    <div class="records-tab">رفض</div>
  </section>

  <section class="empty-records" aria-label="لا توجد سجلات">
    <svg class="empty-art" viewBox="0 0 260 260" aria-hidden="true">
      <path class="line" d="M73 45h103l28 28v133H73z"/>
      <path class="line" d="M176 45v30h28"/>
      <path class="line" d="M96 89h72M96 112h72M96 135h50M96 158h40"/>
      <circle cx="164" cy="156" r="45" fill="#fff" stroke="#397bdc" stroke-width="5"/>
      <path class="line" d="M197 190l28 28"/>
      <path class="line" d="M151 142l26 26M177 142l-26 26"/>
      <path class="line" d="M57 71l10 10M57 211l10-10M213 91l10-10"/>
    </svg>
  </section>
</main>
</div>
<nav class="bottom-nav" aria-label="التنقل الرئيسي">

  </a>
  <a class="nav-item " href="employment.html">
    <span class="nav-svg"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 16.5h34v24H7z" fill="currentColor" opacity=".95"/><path d="M15 16.5V12c0-2.2 1.8-4 4-4h10c2.2 0 4 1.8 4 4v4.5" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M24 20v4m-6-1c2.1 1.6 3.9 2.4 6 2.4s3.9-.8 6-2.4" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/><path d="M18 31c1.7-3.2 4-4.8 6-4.8s4.3 1.6 6 4.8" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/></svg></span><small>التوظيف</small>
  </a>
  <a class="nav-item center " href="bottom-tasks.html">
    <span class="center-circle"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M28 4 12 27h11l-3 17 16-24H25z" fill="currentColor"/></svg></span><small>المنصب</small>
  </a>
  <a class="nav-item active" href="bottom-records.html">
    <span class="nav-svg"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="7" width="28" height="34" rx="4" fill="currentColor"/><path d="M17 17h14M17 24h14M17 31h10" stroke="white" stroke-width="3" stroke-linecap="round"/></svg></span><small>السجل</small>
  </a>
  <a class="nav-item " href="bottom-profile.html">
    <span class="nav-svg"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="15" r="9" fill="currentColor"/><path d="M8 42c1.5-10 7.2-15 16-15s14.5 5 16 15" fill="currentColor"/></svg></span><small>المركز الشخصي</small>
  </a>
</nav>
</body>
</html>
