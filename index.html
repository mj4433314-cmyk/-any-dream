<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Cairo",sans-serif;background:#f5f7fa;color:#17202a}
.app{max-width:480px;height:100vh;margin:auto;background:#fff;display:flex;flex-direction:column}
header{padding:18px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px}
.logo{width:45px;height:45px;border-radius:50%;background:#08a88a;color:#fff;display:grid;place-items:center;font-size:23px;font-weight:bold}
h2{margin:0;font-size:19px}.status{color:#20a77d;font-size:13px;margin-top:4px}
.messages{flex:1;overflow:auto;padding:18px;background:#f7f9fb}
.msg{max-width:80%;padding:10px 13px;margin:8px 0;border-radius:15px;background:#e9eef3;line-height:1.5}
.msg.me{margin-right:auto;background:#08a88a;color:#fff;border-bottom-left-radius:4px}
.msg:not(.me){margin-left:auto;border-bottom-right-radius:4px}
.time{font-size:10px;opacity:.65;margin-top:3px}
form{display:flex;gap:8px;padding:10px;border-top:1px solid #ddd;background:#fff}
input{flex:1;border:1px solid #d5dbe1;border-radius:12px;padding:13px;font-size:15px;outline:none}
button{border:0;border-radius:12px;background:#08a88a;color:white;padding:0 18px;font-size:15px}
.note{text-align:center;color:#777;font-size:12px;padding:7px;background:#fafafa}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">HR</div>
<div><h2>غرفة HR Chat</h2><div class="status">● متصل</div></div>
</header>
<div id="messages" class="messages">
<div class="msg">مرحباً 👋<br>هذه واجهة المحادثة الخاصة بموقعك.<div class="time">الآن</div></div>
</div>
<div class="note">نسخة تجريبية — الرسائل المحلية محفوظة على هذا الجهاز</div>
<form id="form">
<input id="text" autocomplete="off" placeholder="اكتب رسالتك..." maxlength="500">
<button type="submit">إرسال</button>
</form>
</div>
<script>
const box=document.getElementById('messages'), form=document.getElementById('form'), input=document.getElementById('text');
const key='hr_chat_messages';
function render(){
  const data=JSON.parse(localStorage.getItem(key)||'[]');
  data.forEach(x=>add(x.text,x.time,true));
}
function add(text,time,skip){
  const d=document.createElement('div'); d.className='msg me';
  d.textContent=text;
  const t=document.createElement('div'); t.className='time'; t.textContent=time;
  d.appendChild(t); box.appendChild(d); box.scrollTop=box.scrollHeight;
}
render();
form.addEventListener('submit',e=>{
 e.preventDefault(); const text=input.value.trim(); if(!text)return;
 const time=new Date().toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
 const data=JSON.parse(localStorage.getItem(key)||'[]'); data.push({text,time});
 localStorage.setItem(key,JSON.stringify(data)); add(text,time); input.value='';
});
</script>
</body>
</html>
