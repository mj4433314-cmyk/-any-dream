<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>ACCE - منصة العمل والتواصل</title>

</head>
<body>
    <div class="app-container">

        <header class="header">
            <div class="logo">ACCE</div>
            <div class="header-icons">
                <span class="icon">🇦🇪</span>
                <span class="icon">🔍</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Video Section -->
            <div class="video-container">
                <div class="video-text">للانضمام ارسل رسالة على الخاص</div>
                <div class="video-wrapper">
                    <img src="https://via.placeholder.com/400x250/1e3a8a/ffffff?text=ACCE+Team" alt="فريق العمل">
                </div>
            </div>

            <!-- Features Section -->
            <div class="features">
                <div class="feature-card">
                    <div class="feature-icon">📹</div>
                    <div class="feature-label">فيديو تعليمي</div>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">📋</div>
                    <div class="feature-label">منح الاحتيال</div>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">��</div>
                    <div class="feature-label">مركز المساعدة</div>
                </div>
            </div>

            <!-- Video Players -->
            <div class="video-players">
                <div class="player-item">▶</div>
                <div class="player-item">▶</div>
                <div class="player-item video-main">
                    <div class="play-button">▶</div>
                </div>
            </div>

            <button class="btn-more">المزيد من الفيديوهات</button>

            <!-- Staff Section -->
            <div class="staff-section">
                <h2>موظف</h2>
                <div class="staff-container">
                    <div class="staff-card">
                        <div class="staff-avatar">👨</div>
                        <div class="staff-id">7672</div>
                        <div class="staff-name">354</div>
                    </div>
                    <div class="staff-card">
                        <div class="staff-avatar">👩</div>
                        <div class="staff-id">****4075</div>
                        <div class="staff-salary">$ 220</div>
                    </div>
                    <div class="staff-card">
                        <div class="staff-avatar">👨</div>
                        <div class="staff-id">****8007</div>
                        <div class="staff-salary">$ 953</div>
                    </div>
                    <div class="staff-card gift">
                        <div class="gift-icon">🎁</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">الرئيسية</span>

            <a href="jobs.html" class="nav-item">

            <a href="summary.html" class="nav-item">

                <span class="nav-label">المركز الشخصي</span>
